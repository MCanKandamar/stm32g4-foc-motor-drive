name: Firmware build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Memory usage
        run: arm-none-eabi-size build/${{ matrix.preset }}/015_BLDC_FOC_RTOS_MotorDrive.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/015_BLDC_FOC_RTOS_MotorDrive.elf
            build/${{ matrix.preset }}/015_BLDC_FOC_RTOS_MotorDrive.map
          retention-days: 14