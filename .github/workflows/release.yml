name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset Release

      - name: Build
        run: cmake --build --preset Release

      - name: Create hex and bin
        working-directory: build/Release
        run: |
          arm-none-eabi-objcopy -O ihex   015_BLDC_FOC_RTOS_MotorDrive.elf 015_BLDC_FOC_RTOS_MotorDrive.hex
          arm-none-eabi-objcopy -O binary 015_BLDC_FOC_RTOS_MotorDrive.elf 015_BLDC_FOC_RTOS_MotorDrive.bin

      - name: Publish GitHub Release
        working-directory: build/Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            015_BLDC_FOC_RTOS_MotorDrive.elf \
            015_BLDC_FOC_RTOS_MotorDrive.hex \
            015_BLDC_FOC_RTOS_MotorDrive.bin